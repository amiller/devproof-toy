name: Build enclave image
on:
  push:
    branches: [main]
    paths: [enclave/**]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: enclave
          push: true
          tags: |
            ghcr.io/amiller/devproof-toy:latest
            ghcr.io/amiller/devproof-toy:${{ github.sha }}
